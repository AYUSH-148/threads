<svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Relay's mark: two chevrons handing a baton forward, inside the ring the old
    mark used. The gradient stops are unchanged from that mark, so the nav and
    the rest of the accent palette still agree.
  -->
  <defs>
    <linearGradient id="relayMark" x1="15" y1="0" x2="15" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DD7EFF" />
      <stop offset="0.461458" stop-color="#685DFF" />
      <stop offset="1" stop-color="#2152FF" />
    </linearGradient>
  </defs>
  <circle cx="15" cy="15" r="13.915" stroke="url(#relayMark)" stroke-width="2.17" />
  <path d="M8 10.8 L12.2 15 L8 19.2" stroke="url(#relayMark)" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round" />
  <path d="M13.4 10.8 L17.6 15 L13.4 19.2" stroke="url(#relayMark)" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="21.6" cy="15" r="1.7" fill="url(#relayMark)" />
</svg>
