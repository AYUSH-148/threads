# Local development dependencies.
#
#   docker compose up -d
#   MONGODB_URL=mongodb://localhost:27017/threads?replicaSet=rs0
#   REDIS_URL=redis://localhost:6379
#
# Mongo runs as a single-node replica set rather than a standalone: the outbox
# write and the domain write happen in one transaction, and transactions are
# unavailable on a standalone mongod.

services:
  mongo:
    image: mongo:7
    container_name: threads-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once the
      # node has actually been elected primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: threads-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
